name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Superseded runs on the same PR are pointless; pushes to main each get a run
# so every commit on the protected branch has its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # `version` is cross-checked against `packageManager` in web/package.json:
      # the action fails loudly if the two ever drift apart.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.3
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
